spring:
  mvc:
    problemdetails:
      enabled: true

  application:
    name: WebmailClient

  datasource:
    url: jdbc:h2:file:./data/webmailclient
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true