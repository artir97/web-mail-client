<div class="register-page">
  <form class="register-form" (ngSubmit)="register()">
    <h1>Register</h1>

    <label for="firstName">First name</label>
    <input
      id="firstName"
      name="firstName"
      type="text"
      [(ngModel)]="firstName"
      required
    />

    <label for="lastName">Last name</label>
    <input
      id="lastName"
      name="lastName"
      type="text"
      [(ngModel)]="lastName"
      required
    />

    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
      required
    />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      required
    />

    <label for="confirmPassword">Confirm password</label>
    <input
      id="confirmPassword"
      name="confirmPassword"
      type="password"
      [(ngModel)]="confirmPassword"
      required
    />

    <button type="submit" [disabled]="isLoading">
      @if (isLoading) {
        Registering...
      } @else {
        Register
      }
    </button>

    @if (successMessage) {
      <p class="success">{{ successMessage }}</p>
    }

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

  </form>
</div>
